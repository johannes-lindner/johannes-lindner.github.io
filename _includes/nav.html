{% assign home = '/' | relative_url %}
{% assign on_home = false %}
{% if page.url == '/' or page.url == '/index.html' %}{% assign on_home = true %}{% endif %}

<nav class="navbar navbar-b navbar-trans navbar-expand-md fixed-top" id="mainNav">

      aria-controls="navbarDefault" aria-expanded="false" aria-label="Toggle navigation">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <div class="navbar-collapse collapse justify-content-end" id="navbarDefault">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link js-scroll{% if page.nav == 'home' %} active{% endif %}" href="{% if on_home %}#home{% else %}{{ home }}{% endif %}">Home</a>

        <li class="nav-item">
          <a class="nav-link js-scroll{% if page.nav == 'about' %} active{% endif %}" href="{% if on_home %}#about{% else %}{{ home }}#about{% endif %}">About</a>

          <a class="nav-link js-scroll{% if page.nav == 'projects' %} active{% endif %}" href="{% if on_home %}#projects{% else %}{{ home }}#projects{% endif %}">Featured Work</a>

        <li class="nav-item">
